[env:xiao-esp32-s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_port = COM12
monitor_filters = esp32_exception_decoder
upload_port = COM12
